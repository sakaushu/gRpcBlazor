services:
  blazor-client:
    build:
      context: .
      dockerfile: ./docker/GATEWAY_Launcher/Dockerfile
    image: robocross/gateway-blazor:release
    container_name: blazor-client-build
    ports:
      - "5001:5001"
    environment:
      # Development:開発環境 appsettings.Development.json
      # Production:本番環境　appsettings.json
      - ASPNETCORE_ENVIRONMENT=Production
      - GrpcServer__Address=http://grpc-server:5000
      - Logging__FilePath=/app/logs/launcher/launcher.log
    depends_on:
      - grpc-server
    networks:
      - grpc-network
    restart: unless-stopped

  grpc-server:
    build:
      context: .
      dockerfile: ./docker/GATEWAY_Core/Dockerfile
    image: robocross/gateway-core:release
    container_name: grpc-server-build
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DBUS_SYSTEM_BUS_ADDRESS=unix:path=/run/dbus/system_bus_socket
      - Logging__FilePath=/app/logs/core/grpc-server.log
    networks:
      - grpc-network
    restart: unless-stopped

  nginx:
    image: nginx:latest
    container_name: nginx-proxy-release
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - blazor-client
      - grpc-server
    networks:
      - grpc-network
    restart: unless-stopped

networks:
  grpc-network:
    driver: bridge
