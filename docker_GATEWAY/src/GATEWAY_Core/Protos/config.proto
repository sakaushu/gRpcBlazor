syntax = "proto3";

import "google/protobuf/empty.proto";

package GATEWAYCore;

// ===== Enums =====
enum ConfigValueType {
    CONFIG_VALUE_TYPE_UNSPECIFIED = 0;
    HEX = 1;
    DECIMAL = 2;
    STRING = 3;
}

// ===== Service =====
service ConfigsService {
    // 設定値管理関連のRPC
    rpc GetConfig(GetConfigRequest) returns (GetConfigResponse);
    rpc GetConfigRange(GetConfigRequest) returns (GetConfigRangeResponse);
    rpc SetConfig(SetConfigRequest) returns (SetConfigResponse);
    rpc SaveConfig(google.protobuf.Empty) returns (SaveConfigResponse);
    rpc SetSaveConfig(SetConfigRequest) returns (SetConfigResponse);
    rpc GetAllConfigs(google.protobuf.Empty) returns (GetAllConfigsResponse);
    rpc SetConfigsBatch(SetConfigsBatchRequest) returns (SetConfigsBatchResponse);
    rpc ValidateConfig(ValidateConfigRequest) returns (ValidateConfigResponse);
    rpc ResetConfig(ResetConfigRequest) returns (ResetConfigResponse);
    rpc ResetAllConfigs(google.protobuf.Empty) returns (ResetConfigResponse);
}

// ===== Message =====

message ConfigMetadata {
    int32 key = 1;
    string item_name = 2;
    string description = 3;
    ConfigValueType value_type = 4;
    string default_value = 5;
    int64 min_value = 6;
    int64 max_value = 7;
}

message GetConfigRequest {
    int32 key = 1;
}

message GetConfigResponse {
    bool found = 1;
    string value = 2;
    ConfigValueType value_type = 3;
    string error = 4;
}

message GetConfigRangeResponse {
    bool found = 1;
    int64 min_value = 2;
    int64 max_value = 3;
    string value = 4;
    ConfigValueType value_type = 5;
    string error = 6;
}

message SetConfigRequest {
    int32 key = 1;
    string value = 2;
}

message SetConfigResponse {
    bool success = 1;
    string error = 2;
    string value = 3;
}

message SaveConfigResponse {
    bool success = 1;
    string error = 2;
}

message GetAllConfigsResponse {
    repeated ConfigItem configs = 1;
    string error = 2;
}

message ConfigItem {
    int32 key = 1;
    string value = 2;
    ConfigValueType value_type = 3;
}

message SetConfigsBatchRequest {
    repeated ConfigSetItem updates = 1;
}

message ConfigSetItem {
    int32 key = 1;
    string value = 2;
}

message SetConfigsBatchResponse {
    bool success = 1;
    repeated ConfigSetResult results = 2;
    string error = 3;
}

message ConfigSetResult {
    int32 key = 1;
    bool success = 2;
    string error = 3;
}

message ValidateConfigRequest {
    int32 key = 1;
    string value = 2;
}

message ValidateConfigResponse {
    bool is_valid = 1;
    string error_message = 2;
}

message ResetConfigRequest {
    int32 key = 1;
}

message ResetConfigResponse {
    bool success = 1;
    string error = 2;
    string default_value = 3;
}
