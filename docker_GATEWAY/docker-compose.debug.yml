services:
  # Nginx リバースプロキシ
  nginx:
    image: nginx:latest
    container_name: nginx-proxy
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - blazor-client
      - grpc-server
    networks:
      - grpc-network
    restart: unless-stopped

  # gRPC サーバー（Core）- Debug版
  grpc-server:
    build:
      context: .
      dockerfile: ./docker/GATEWAY_Core/Dockerfile.debug
    container_name: grpc-server-debug
    ports:
      - "5001:5001"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5001
      - DBUS_SYSTEM_BUS_ADDRESS=unix:path=/run/dbus/system_bus_socket
    networks:
      - grpc-network
    restart: unless-stopped
    volumes:
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket
      - /etc/machine-id:/etc/machine-id:ro
      - ./logs/core:/app/logs/core
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined

  # Blazor クライアント（Launcher）- Debug版
  blazor-client:
    build:
      context: .
      dockerfile: ./docker/GATEWAY_Launcher/Dockerfile.debug
    container_name: blazor-client-debug
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
      - GrpcServer__Address=http://grpc-server:5001
    depends_on:
      - grpc-server
    networks:
      - grpc-network
    restart: unless-stopped
    volumes:
      - ./logs/launcher:/app/logs/launcher
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined

networks:
  grpc-network:
    driver: bridge